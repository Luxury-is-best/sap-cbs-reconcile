name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "gui_app.py"
      - "total_reconcile_service.py"
      - "backend_reconcile_sap_cbs.py"
      - "reconcile_sap_cbs.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe (onedir)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name 对账助手 --onedir gui_app.py

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\对账助手\*" -DestinationPath "dist\对账助手_windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 对账助手_windows
          path: dist/对账助手_windows.zip
          if-no-files-found: error